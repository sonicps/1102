<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PS4 webkit Jailbreak</title>

<style>
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background-color: #000000;
    color: #fff;
    font-family: Arial, sans-serif;
    margin: 0;
    overflow: hidden;
  }

  .container-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    z-index: 3;
  }

  .title-wrapper {
    position: relative;
    display: inline-block;
  }

  .title {
    font-size: 105px;
    font-weight: 800;
    letter-spacing: -2px;
    margin: 0;
    background: linear-gradient(45deg, #00c2ff, #33ff8c, #ffc640, #e54cff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 30px rgba(0, 194, 255, 0.4);
    white-space: nowrap;
    position: relative;
    z-index: 3;
  }

  .reflection {
    font-size: 105px;
    font-weight: 800;
    letter-spacing: -2px;
    margin: 0;
    transform: scaleY(-1);
    margin-top: -12px;
    opacity: 0.25;
    background: linear-gradient(to bottom, rgba(255,255,255,0.9), transparent);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: blur(2px);
    pointer-events: none;
    white-space: nowrap;
  }

  /* Container tombol */
  .button-group {
    display: flex;
    flex-direction: row;
    gap: 20px;
    margin-top: 25px;
  }

  /* Styling Tombol Oval */
  .btn-oval {
    position: relative;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    padding: 16px 45px;
    background: rgba(10, 20, 35, 0.85);
    border: 2px solid #00d2ff;
    border-radius: 100px;
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 0 20px rgba(0, 210, 255, 0.4), 
                inset 0 0 15px rgba(0, 210, 255, 0.2);
    transition: all 0.3s ease;
    z-index: 1;
  }

  /* Teks Utama di Dalam Tombol */
  .btn-oval span {
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 2px;
    color: #ffd700;
    transition: all 0.3s ease;
  }

  /* Efek Shine Biru Saat Hover Pada Tombol */
  .btn-oval:hover {
    transform: scale(1.05);
    box-shadow: 0 0 35px rgba(0, 210, 255, 0.9), 
                inset 0 0 25px rgba(0, 210, 255, 0.5);
    border-color: #00e5ff;
  }

  .btn-oval:hover span {
    /* Gradasi kilapan warna biru-putih-biru */
    background: linear-gradient(-40deg, transparent 0%, transparent 35%, #00d2ff 45%, #ffffff 50%, #00e5ff 55%, transparent 65%, transparent 100%) -250px 0 / 250px no-repeat;
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    color: rgba(0, 210, 255, 0.4);
    text-shadow: 0 0 15px rgba(0, 210, 255, 0.8);
    animation: shine-blue 2.2s infinite ease-in-out;
    -webkit-animation: shine-blue 2.2s infinite ease-in-out;
  }

  @-webkit-keyframes shine-blue {
    0%, 10% {
      background-position: -250px;
    }
    30% {
      background-position: top left;
    }
    80% {
      background-position: top right;
    }
    100% {
      background-position: 350px;
    }
  }

  @keyframes shine-blue {
    0%, 10% {
      background-position: -250px;
    }
    30% {
      background-position: top left;
    }
    80% {
      background-position: top right;
    }
    100% {
      background-position: 350px;
    }
  }

  #datetime-widget {
    position: fixed;
    bottom: 25px;
    left: 30px;
    z-index: 10;
    color: #ffffff;
    text-shadow: 0 0 10px rgba(0, 194, 255, 0.6);
    pointer-events: none;
  }

  #clock {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 1px;
  }

  #date {
    font-size: 14px;
    font-weight: 400;
    color: #00c2ff;
    letter-spacing: 0.5px;
    margin-top: 2px;
  }

  /* Watermark Glitch Kanan Bawah */
  .watermark-glitch-wrapper {
    position: fixed;
    bottom: 25px;
    right: 30px;
    z-index: 10;
    pointer-events: none;
  }

  h1.glitch {
    color: white;
    font-family: sans-serif;
    font-weight: 800;
    position: relative;
    font-size: 32px;
    margin: 0;
    padding: 0;
  }

  h1.glitch::before, h1.glitch::after {
    padding: 0;
    color: white;
    content: "sonicps";
    position: absolute;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
    top: 0;
  }

  h1.glitch::before {
    left: 3px;
    text-shadow: -2px 0 red;
    animation-name: glitch-animation-1;
    animation-duration: 2s;
    animation-timing-function: linear;
    animation-delay: 0s;
    animation-iteration-count: infinite;
    animation-direction: alternate-reverse;
  }

  h1.glitch::after {
    left: -3px;
    text-shadow: -2px 0 blue;
    animation-name: glitch-animation-2;
    animation-duration: 2s;
    animation-timing-function: linear;
    animation-delay: 0s;
    animation-iteration-count: infinite;
    animation-direction: alternate-reverse;
  }

  @keyframes glitch-animation-1 {
    0% { clip: rect(12px, 200px, 35px, 0); }
    5% { clip: rect(45px, 200px, 10px, 0); }
    10% { clip: rect(2px, 200px, 40px, 0); }
    15% { clip: rect(38px, 200px, 18px, 0); }
    20% { clip: rect(15px, 200px, 5px, 0); }
    25% { clip: rect(42px, 200px, 30px, 0); }
    30% { clip: rect(8px, 200px, 48px, 0); }
    35% { clip: rect(27px, 200px, 12px, 0); }
    40% { clip: rect(3px, 200px, 33px, 0); }
    45% { clip: rect(31px, 200px, 22px, 0); }
    50% { clip: rect(19px, 200px, 7px, 0); }
    55% { clip: rect(40px, 200px, 28px, 0); }
    60% { clip: rect(14px, 200px, 45px, 0); }
    65% { clip: rect(25px, 200px, 16px, 0); }
    70% { clip: rect(6px, 200px, 39px, 0); }
    75% { clip: rect(33px, 200px, 21px, 0); }
    80% { clip: rect(21px, 200px, 9px, 0); }
    85% { clip: rect(44px, 200px, 32px, 0); }
    90% { clip: rect(11px, 200px, 41px, 0); }
    95% { clip: rect(29px, 200px, 17px, 0); }
    100% { clip: rect(4px, 200px, 26px, 0); }
  }

  @keyframes glitch-animation-2 {
    0% { clip: rect(30px, 200px, 8px, 0); }
    5% { clip: rect(15px, 200px, 42px, 0); }
    10% { clip: rect(40px, 200px, 19px, 0); }
    15% { clip: rect(5px, 200px, 31px, 0); }
    20% { clip: rect(22px, 200px, 11px, 0); }
    25% { clip: rect(37px, 200px, 45px, 0); }
    30% { clip: rect(18px, 200px, 4px, 0); }
    35% { clip: rect(43px, 200px, 27px, 0); }
    40% { clip: rect(9px, 200px, 36px, 0); }
    45% { clip: rect(26px, 200px, 14px, 0); }
    50% { clip: rect(2px, 200px, 48px, 0); }
    55% { clip: rect(34px, 200px, 20px, 0); }
    60% { clip: rect(17px, 200px, 6px, 0); }

    85% { clip: rect(36px, 200px, 23px, 0); }
    90% { clip: rect(20px, 200px, 3px, 0); }
    95% { clip: rect(45px, 200px, 32px, 0); }
    100% { clip: rect(10px, 200px, 25px, 0); }
  }
</style>

<script>
// Jam & Tanggal Realtime
function updateDateTime() {
    const now = new Date();
    
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const seconds = String(now.getSeconds()).padStart(2, '0');
    document.getElementById('clock').innerHTML = `${hours}:${minutes}:${seconds}`;

    const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
    document.getElementById('date').innerHTML = now.toLocaleDateString('en-US', options);
}
setInterval(updateDateTime, 1000);
updateDateTime();
</script>
